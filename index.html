<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study & Review Hub</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-emerald: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --active-glow: rgba(139, 92, 246, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Bar */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand i {
            color: var(--accent-purple);
            -webkit-text-fill-color: initial;
            font-size: 1.4rem;
        }

        /* Navigation Tabs */
        nav.tabs-container {
            display: flex;
            gap: 0.5rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.25rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.6rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            outline: none;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Tab Active States with Custom Accent Colors */
        .tab-btn[data-target="graphics"].active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.1));
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.25);
        }

        .tab-btn[data-target="network"].active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.1));
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
        }

        .tab-btn[data-target="gamedev"].active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.1));
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .external-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .external-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        /* Main Content Viewport */
        main {
            flex: 1;
            position: relative;
            background: var(--bg-primary);
            width: 100%;
            height: calc(100vh - 65px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            background: #ffffff; /* Assumes reviewer pages might have standard light background */
        }

        iframe.active {
            opacity: 1;
            visibility: visible;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 0.75rem;
                padding: 0.75rem 1rem;
            }

            nav.tabs-container {
                width: 100%;
                justify-content: space-between;
            }

            .tab-btn {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
                flex: 1;
                justify-content: center;
            }

            .brand span {
                display: none;
            }

            .actions {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Learning Portal</span>
        </div>

        <nav class="tabs-container">
            <button class="tab-btn active" data-target="graphics" onclick="switchTab('graphics')">
                <i class="fa-solid fa-palette"></i> Computer Graphics
            </button>
            <button class="tab-btn" data-target="network" onclick="switchTab('network')">
                <i class="fa-solid fa-network-wired"></i> Network Reviewer
            </button>
            <button class="tab-btn" data-target="gamedev" onclick="switchTab('gamedev')">
                <i class="fa-solid fa-gamepad"></i> Game Dev
            </button>
        </nav>

        <div class="actions">
            <a id="open-new-tab" href="computergraphics.html" target="_blank" class="external-btn" title="Open in new tab">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Fullscreen
            </a>
        </div>
    </header>

    <main>
        <iframe id="iframe-graphics" class="active" src="computergraphics.html" title="Computer Graphics Reviewer"></iframe>
        <iframe id="iframe-network" src="networkreviewer.html" title="Network Reviewer"></iframe>
        <iframe id="iframe-gamedev" src="gamedev.html" title="Game Development Reviewer"></iframe>
    </main>

    <script>
        const fileMap = {
            'graphics': 'computergraphics.html',
            'network': 'networkreviewer.html',
            'gamedev': 'gamedev.html'
        };

        function switchTab(tabKey) {
            // Update Tab Buttons
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-target') === tabKey) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Update Iframes
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                if (iframe.id === `iframe-${tabKey}`) {
                    iframe.classList.add('active');
                } else {
                    iframe.classList.remove('active');
                }
            });

            // Update External Link Button
            const externalBtn = document.getElementById('open-new-tab');
            if (externalBtn && fileMap[tabKey]) {
                externalBtn.href = fileMap[tabKey];
            }
        }
    </script>

</body>
</html>
